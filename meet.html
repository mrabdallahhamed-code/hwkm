<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>اجتماع حوكم</title>
<style>html,body{height:100%;margin:0;overflow:hidden;font-family:Tajawal,system-ui,sans-serif;background:#0D2447;color:#fff}
#msg{display:flex;height:100%;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;line-height:1.9}
#j{height:100%}</style></head><body>
<div id="msg">جارٍ تجهيز الاجتماع…</div><div id="j" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>window.HWKM_SUPABASE_URL="https://omddnkofsdtwfjkxdktt.supabase.co";window.HWKM_SUPABASE_ANON="sb_publishable_SbHWC7JAuyvXypZyJeiWkg_I9Y4gjbj";</script>
<script>
(async()=>{
  const msg=document.getElementById("msg");
  const fail=t=>{msg.textContent=t;msg.style.display="flex"};
  try{
    const q=new URLSearchParams(location.search),room=q.get("r"),cid=Number(q.get("c"));
    if(!room||!cid) return fail("رابط الاجتماع غير صالح.");
    const sb=supabase.createClient(window.HWKM_SUPABASE_URL,window.HWKM_SUPABASE_ANON);
    const {data:{session}}=await sb.auth.getSession();
    if(!session) return fail("سجّل الدخول إلى حوكم أولًا ثم افتح رابط الاجتماع مرة أخرى.");
    const r=await fetch(window.HWKM_SUPABASE_URL+"/functions/v1/jitsi-meeting",{method:"POST",
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token,apikey:window.HWKM_SUPABASE_ANON},
      body:JSON.stringify({action:"token",company_id:cid,room})});
    const d=await r.json();
    if(!r.ok||!d.jwt) return fail(d.error||"تعذّر الدخول إلى الاجتماع.");
    const s=document.createElement("script");
    const DOM="8x8.vc"; /* النطاق العام لخدمة الاجتماعات */
    s.src="https://"+DOM+"/"+d.appId+"/external_api.js";
    let api=null,joined=false,wasJoined=false;
    const back=document.createElement("button");
    back.textContent="العودة إلى الاجتماع";
    back.style.cssText="display:none;position:fixed;inset:auto 0 24px 0;margin:auto;width:240px;padding:14px;border:0;border-radius:12px;background:#B8972A;color:#0D2447;font:700 16px Tajawal,system-ui;z-index:9;cursor:pointer";
    document.body.appendChild(back);
    const start=()=>{back.style.display="none";const el=document.getElementById("j");
      if(api){try{api.dispose()}catch(e){}api=null;el.innerHTML=""}
      msg.style.display="none";el.style.display="block";joined=false;
      api=new JitsiMeetExternalAPI(DOM,{roomName:d.appId+"/"+room,jwt:d.jwt,parentNode:el,width:"100%",height:"100%",lang:"ar"});
      api.addListener("videoConferenceJoined",()=>{joined=true;wasJoined=true;back.style.display="none"});
      /* عند انقطاع الاتصال (مثلًا بعد التنقل إلى تطبيق آخر في الجوال) يظهر زر العودة */
      const lost=()=>{joined=false;back.style.display="block"};
      api.addListener("videoConferenceLeft",lost);
      api.addListener("readyToClose",lost);
    };
    back.onclick=start;
    /* عند عودة المشارك إلى الصفحة بعد انقطاع الاتصال نعيد الدخول تلقائيًا */
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&wasJoined&&!joined)start()});
    s.onload=start;
    s.onerror=()=>fail("تعذّر تحميل خدمة الاجتماعات.");
    document.body.appendChild(s);
  }catch(e){fail("حدث خطأ غير متوقع.")}
})();
</script></body></html>
